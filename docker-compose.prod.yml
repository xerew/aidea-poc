# docker-compose.prod.yml
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aidea
      POSTGRES_USER: aidea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # SSH tunnel to the self-hosted Ollama used for course content translation.
  # The private key lives on the host at ./docker/ollama-tunnel/keys/id_ed25519
  # (not in git). Reachable inside the network as http://ollama-tunnel:11434.
  ollama-tunnel:
    build: ./docker/ollama-tunnel
    environment:
      SSH_REMOTE_USER: ${SSH_REMOTE_USER:-ngrammatikos}
      SSH_REMOTE_HOST: ${SSH_REMOTE_HOST:-147.102.17.66}
    volumes:
      - ./docker/ollama-tunnel/keys:/keys:ro
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: prod
    environment:
      DATABASE_URL: postgresql://aidea:${POSTGRES_PASSWORD}@db:5432/aidea
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEBUG: "False"
      ALLOWED_HOSTS: ${DOMAIN:-localhost}
      # Email (password resets). Leave EMAIL_HOST empty to disable sending.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-AIDEA <info@aidea-hub.eu>}
      OLLAMA_URL: http://ollama-tunnel:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3-translator}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      - db
      - redis
      - ollama-tunnel
    restart: unless-stopped

  celery:
    build:
      context: ./backend
      target: prod
    environment:
      DATABASE_URL: postgresql://aidea:${POSTGRES_PASSWORD}@db:5432/aidea
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      OLLAMA_URL: http://ollama-tunnel:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3-translator}
    command: uv run celery -A aidea worker -l warning
    depends_on:
      - db
      - redis
      - ollama-tunnel
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      target: prod
    environment:
      DATABASE_URL: postgresql://aidea:${POSTGRES_PASSWORD}@db:5432/aidea
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
    command: uv run celery -A aidea beat -l warning --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      # The Caddyfile reads {$DOMAIN}; it must be present inside the container.
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - static_files:/srv/static
      - media_files:/srv/media
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  caddy_data:
  caddy_config:
